[package]
name = "sigring_py"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
name = "_sigring"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
numpy = "0.23"
sigring = "0.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
