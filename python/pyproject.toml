[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "sigring"
version = "0.1.0"
description = "Exact, streaming, sliding-window truncated path signatures in a wrapping integer ring (Python bindings)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Matteo Pozza", email = "metapozza@proton.me" }]
keywords = ["path signature", "rough paths", "sliding window", "time series", "streaming"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/metapozza/sigring"

[tool.maturin]
module-name = "sigring._sigring"
